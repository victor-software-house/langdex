# OpenSpec reads the project context and the per-artifact rules from here.
schema: spec-driven

# specs:budget fails a change file over its word budget. A word is a
# whitespace-separated token, and a reference-style link definition does not
# count. The budgets bound a change's scope: a change that outgrows one is
# split into smaller changes, never cut down to fit.
rules:
  proposal:
    - Keep proposal.md within 600 words.
    - >-
      Scope the change so every artifact fits its budget. When one would not,
      split the work into smaller changes, each with its own proposal, rather
      than cutting text to fit.
    - >-
      Keep the headings `## Why` and `## What Changes` exactly, because
      OpenSpec's change parser requires them.
  design:
    - >-
      Keep design.md within 2500 words, and the change's
      research.md within 2500.
  specs:
    - Keep each spec.md within 1200 words.
  tasks:
    - >-
      Keep the task text of tasks.md, headings and Verify lines included,
      within 1500 words.
    - Keep each dated evidence note under a task within 60 words.
